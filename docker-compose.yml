services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-truckgo}
      POSTGRES_USER: ${POSTGRES_USER:-truckgo_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "if [ -n \"$${REDIS_PASSWORD}\" ]; then exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\"; else exec redis-server --appendonly yes; fi"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi"]
      interval: 5s
      timeout: 3s
      retries: 15

  # Private object storage for shipment photos. Official MinIO images are no longer published, so this uses
  # Chainguard's build of the MinIO server, pinned by digest. Only bound to localhost for local tooling.
  minio:
    image: cgr.dev/chainguard/minio@sha256:3b6e40c30ecd5cea627e382ff0b82ca841f58c52294578787043ee80c8ef7c82
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-truckgo_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_minio_local}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 15

  # One-shot setup with the root account: private bucket + an application user limited to that bucket. The backend
  # never receives the root credentials.
  minio-init:
    image: cgr.dev/chainguard/minio@sha256:3b6e40c30ecd5cea627e382ff0b82ca841f58c52294578787043ee80c8ef7c82
    entrypoint: ["bash", "/init/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-truckgo_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_minio_local}
      MINIO_BUCKET: ${MINIO_BUCKET:-truckgo-private}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:-truckgo_app}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:-change_me_minio_app}
    volumes:
      - ./infra/minio:/init:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-dev}
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-truckgo}
      POSTGRES_USER: ${POSTGRES_USER:-truckgo_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      # Required when APP_ENV=prod (Base64, >= 32 bytes). Empty in dev = ephemeral key, sessions reset on restart.
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-truckgo-api}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-7d}
      # false only for plain-HTTP localhost; the prod profile refuses to start unless this is true.
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-Strict}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_MAX_ATTEMPTS_PER_IP: ${LOGIN_MAX_ATTEMPTS_PER_IP:-30}
      LOGIN_RATE_LIMIT_WINDOW: ${LOGIN_RATE_LIMIT_WINDOW:-15m}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      MINIO_ENDPOINT: http://minio:9000
      # Application user created by minio-init (bucket-scoped policy), never the MinIO root account.
      MINIO_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:-truckgo_app}
      MINIO_SECRET_KEY: ${MINIO_APP_SECRET_KEY:-change_me_minio_app}
      MINIO_BUCKET: ${MINIO_BUCKET:-truckgo-private}
      STORAGE_ORPHAN_DRY_RUN: ${STORAGE_ORPHAN_DRY_RUN:-true}
      SHIPMENT_BUSINESS_ZONE: ${SHIPMENT_BUSINESS_ZONE:-Asia/Ho_Chi_Minh}
      # Road distance for quotes: none = an admin enters a verified distance; google needs GOOGLE_MAPS_API_KEY.
      MAPS_ROUTE_PROVIDER: ${MAPS_ROUTE_PROVIDER:-none}
      # Address search/geocoding: none = manual addresses; google needs GOOGLE_MAPS_API_KEY (Geocoding API enabled).
      MAPS_GEOCODING_PROVIDER: ${MAPS_GEOCODING_PROVIDER:-none}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      MAPS_CONNECT_TIMEOUT: ${MAPS_CONNECT_TIMEOUT:-3s}
      MAPS_READ_TIMEOUT: ${MAPS_READ_TIMEOUT:-5s}
      QUOTE_VALIDITY: ${QUOTE_VALIDITY:-24h}
      PRICING_CACHE_TTL: ${PRICING_CACHE_TTL:-10m}
      MARKETPLACE_APPLICATION_CUTOFF: ${MARKETPLACE_APPLICATION_CUTOFF:-1h}
      MARKETPLACE_MAX_PENDING_PER_DRIVER: ${MARKETPLACE_MAX_PENDING_PER_DRIVER:-10}
      MARKETPLACE_CACHE_TTL: ${MARKETPLACE_CACHE_TTL:-30s}
      MARKETPLACE_EXPIRY_INTERVAL: ${MARKETPLACE_EXPIRY_INTERVAL:-5m}
      TRIP_OTP_TTL: ${TRIP_OTP_TTL:-30m}
      TRIP_OTP_MAX_ATTEMPTS: ${TRIP_OTP_MAX_ATTEMPTS:-5}
      TRIP_OTP_RESEND_COOLDOWN: ${TRIP_OTP_RESEND_COOLDOWN:-60s}
      TRIP_OTP_MAX_SENDS: ${TRIP_OTP_MAX_SENDS:-5}
      TRIP_OTP_SECRET: ${TRIP_OTP_SECRET:-}
      TRIP_OTP_CHANNEL: ${TRIP_OTP_CHANNEL:-in-app}
      TRIP_REQUIRE_DELIVERY_PHOTO: ${TRIP_REQUIRE_DELIVERY_PHOTO:-false}
      TRACKING_MIN_INTERVAL: ${TRACKING_MIN_INTERVAL:-3s}
      TRACKING_LIVE_THRESHOLD: ${TRACKING_LIVE_THRESHOLD:-60s}
      TRACKING_STALE_THRESHOLD: ${TRACKING_STALE_THRESHOLD:-5m}
      TRACKING_MAX_SPEED_KMH: ${TRACKING_MAX_SPEED_KMH:-200}
      TRACKING_RETENTION: ${TRACKING_RETENTION:-90d}
      # Only read by the one-shot `--bootstrap-admin` command; leave empty otherwise.
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_BOOTSTRAP_FULL_NAME: ${ADMIN_BOOTSTRAP_FULL_NAME:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
