server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
spring:
  application:
    name: truckgo-api
  profiles:
    active: ${APP_ENV:dev}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:truckgo_v2}?currentSchema=public&options=-c%20TimeZone%3DUTC
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  servlet:
    multipart:
      # Per-file limit is enforced again in ShipmentAttachmentService (default 5 MB).
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:5MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:6MB}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
springdoc:
  packages-to-scan: com.truckgo
  paths-to-match: /api/v1/**
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: false
app:
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    bcrypt-strength: ${BCRYPT_STRENGTH:10}
    jwt:
      # Base64-encoded HMAC key, >= 32 bytes (e.g. `openssl rand -base64 48`). Mandatory outside dev/test.
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:truckgo-api}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh:
      ttl: ${REFRESH_TOKEN_TTL:7d}
      reuse-grace: ${REFRESH_REUSE_GRACE:10s}
      cookie-name: ${REFRESH_COOKIE_NAME:tg_refresh}
      cookie-path: /api/v1/auth
      cookie-secure: ${REFRESH_COOKIE_SECURE:true}
      cookie-same-site: ${REFRESH_COOKIE_SAMESITE:Strict}
    login-rate-limit:
      enabled: ${LOGIN_RATE_LIMIT_ENABLED:true}
      max-failures-per-identifier: ${LOGIN_MAX_FAILURES:5}
      max-attempts-per-ip: ${LOGIN_MAX_ATTEMPTS_PER_IP:30}
      window: ${LOGIN_RATE_LIMIT_WINDOW:15m}
  maps:
    # Address search/geocoding: none (manual addresses), photon or osm (free, OpenStreetMap data) or google (GOOGLE_MAPS_API_KEY).
    geocoding:
      provider: ${MAPS_GEOCODING_PROVIDER:none}
      base-url: ${GOOGLE_GEOCODING_URL:https://maps.googleapis.com/maps/api/geocode/json}
      cache-ttl: ${MAPS_GEOCODING_CACHE_TTL:24h}
      searches-per-minute: ${MAPS_GEOCODING_SEARCHES_PER_MINUTE:30}
      max-results: 5
      # Answers outside this box (mainland Viet Nam) are discarded as wrong matches.
      min-latitude: ${MAPS_SERVICE_MIN_LAT:8.0}
      max-latitude: ${MAPS_SERVICE_MAX_LAT:23.5}
      min-longitude: ${MAPS_SERVICE_MIN_LNG:102.0}
      max-longitude: ${MAPS_SERVICE_MAX_LNG:110.0}
    # Road distance for pricing: none (admin enters a verified distance), google, mapbox or osrm (free; mapbox and
    # osrm need coordinates on every stop). Exactly one is used; there is no automatic fallback.
    route-provider: ${MAPS_ROUTE_PROVIDER:none}
    mapbox:
      access-token: ${MAPBOX_ACCESS_TOKEN:}
      base-url: ${MAPBOX_BASE_URL:https://api.mapbox.com}
    route-retry:
      max-attempts: ${MAPS_ROUTE_MAX_ATTEMPTS:2}
      backoff: ${MAPS_ROUTE_BACKOFF:300ms}
    route-cache:
      ttl: ${MAPS_ROUTE_CACHE_TTL:7d}
      # Bump to discard every cached route (e.g. after a road-network update).
      version: ${MAPS_ROUTE_CACHE_VERSION:1}
      lock-wait: ${MAPS_ROUTE_CACHE_LOCK_WAIT:5s}
    route-quota:
      # Provider calls for the whole application; 0 = unlimited. Past the limit quotes go to admin review.
      per-hour: ${MAPS_ROUTE_QUOTA_PER_HOUR:500}
      per-day: ${MAPS_ROUTE_QUOTA_PER_DAY:5000}
    max-reasonable-km: ${MAPS_MAX_REASONABLE_KM:3000}
    # Free OpenStreetMap services. The public servers allow light use only (~1 request/second for the whole app,
    # identifying User-Agent, cached results); set your own Nominatim/OSRM/tile URLs for production volume.
    osm:
      nominatim-url: ${MAPS_NOMINATIM_URL:https://nominatim.openstreetmap.org}
      photon-url: ${MAPS_PHOTON_URL:https://photon.komoot.io}
      osrm-url: ${OSRM_BASE_URL:${MAPS_OSRM_URL:https://router.project-osrm.org}}
      user-agent: ${MAPS_OSM_USER_AGENT:TruckGo/1.0 (+https://github.com/Nguyenvanhieu2403/TruckGo)}
      spacing: 1100ms
      max-wait: 3s
      # Map tiles for the browser: free OpenStreetMap tiles (openstreetmap.de mirror; light use). Attribution is mandatory.
      # tile.openstreetmap.org works too where it resolves; for production volume use your own or a paid tile service.
      tile-url: ${MAPS_TILE_URL:https://tile.openstreetmap.de/{z}/{x}/{y}.png}
      tile-attribution: ${MAPS_TILE_ATTRIBUTION:© OpenStreetMap contributors}
      tile-max-zoom: 19
    google:
      # Never commit a key; set GOOGLE_MAPS_API_KEY in the environment.
      api-key: ${GOOGLE_MAPS_API_KEY:}
      base-url: ${GOOGLE_DIRECTIONS_URL:https://maps.googleapis.com/maps/api/directions/json}
      connect-timeout: ${MAPS_CONNECT_TIMEOUT:3s}
      read-timeout: ${MAPS_READ_TIMEOUT:5s}
  catalog:
    cache-ttl: ${CATALOG_CACHE_TTL:1h}
  pricing:
    cache-ttl: ${PRICING_CACHE_TTL:10m}
    quote-validity: ${QUOTE_VALIDITY:24h}
    # Expires calculated quotes past their validity (reads also expire them, so this only keeps the data tidy).
    expiry-job-enabled: ${QUOTE_EXPIRY_JOB_ENABLED:true}
    expiry-interval: ${QUOTE_EXPIRY_INTERVAL:5m}
    expiry-batch-size: ${QUOTE_EXPIRY_BATCH_SIZE:200}
    # New quote versions a customer may create: per order within the window, and over all orders per hour (0 = off).
    preview-limit:
      per-shipment: ${QUOTE_PREVIEW_PER_SHIPMENT:5}
      shipment-window: ${QUOTE_PREVIEW_WINDOW:10m}
      per-customer-hour: ${QUOTE_PREVIEW_PER_CUSTOMER_HOUR:30}
  shipment:
    business-zone: ${SHIPMENT_BUSINESS_ZONE:Asia/Ho_Chi_Minh}
    min-pickup-lead: ${SHIPMENT_MIN_PICKUP_LEAD:15m}
    max-stops: 10
    max-items: 50
    max-attachments: 10
    max-attachment-size: ${SHIPMENT_MAX_ATTACHMENT_SIZE:5MB}
    allowed-image-types: image/jpeg,image/png,image/webp
  marketplace:
    # Drivers can apply until this long before pickup; open orders expire at the pickup time.
    application-cutoff: ${MARKETPLACE_APPLICATION_CUTOFF:1h}
    max-pending-per-driver: ${MARKETPLACE_MAX_PENDING_PER_DRIVER:10}
    cache-ttl: ${MARKETPLACE_CACHE_TTL:30s}
    expiry-interval: ${MARKETPLACE_EXPIRY_INTERVAL:5m}
    expiry-job-enabled: ${MARKETPLACE_EXPIRY_JOB_ENABLED:true}
  trip:
    # Delivery confirmation code: validity, wrong guesses before lock, wait and limit for new codes.
    otp-ttl: ${TRIP_OTP_TTL:30m}
    otp-max-attempts: ${TRIP_OTP_MAX_ATTEMPTS:5}
    otp-resend-cooldown: ${TRIP_OTP_RESEND_COOLDOWN:60s}
    otp-max-sends: ${TRIP_OTP_MAX_SENDS:5}
    # HMAC key for stored codes; blank = derived from JWT_SECRET.
    otp-secret: ${TRIP_OTP_SECRET:}
    # in-app (notification inbox). An SMS adapter implementing OtpSender can be added for production.
    otp-channel: ${TRIP_OTP_CHANNEL:in-app}
    require-delivery-photo: ${TRIP_REQUIRE_DELIVERY_PHOTO:false}
    max-trip-photos: ${TRIP_MAX_PHOTOS:20}
  tracking:
    min-interval: ${TRACKING_MIN_INTERVAL:3s}
    live-threshold: ${TRACKING_LIVE_THRESHOLD:60s}
    stale-threshold: ${TRACKING_STALE_THRESHOLD:5m}
    max-future-skew: ${TRACKING_MAX_FUTURE_SKEW:2m}
    max-age: ${TRACKING_MAX_AGE:10m}
    max-speed-kmh: ${TRACKING_MAX_SPEED_KMH:200}
    moving-interval: ${TRACKING_MOVING_INTERVAL:8s}
    idle-interval: ${TRACKING_IDLE_INTERVAL:30s}
    min-distance-meters: ${TRACKING_MIN_DISTANCE_METERS:25}
    latest-ttl: ${TRACKING_LATEST_TTL:30m}
    retention: ${TRACKING_RETENTION:90d}
    stream-timeout: ${TRACKING_STREAM_TIMEOUT:10m}
    heartbeat: ${TRACKING_HEARTBEAT:20s}
  storage:
    provider: ${STORAGE_PROVIDER:none}
    endpoint: ${MINIO_ENDPOINT:}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:truckgo-private}
    region: ${MINIO_REGION:}
    cleanup:
      # Deletion queue: retried with exponential backoff (1 min, 2, 4 … max-delay) until max-attempts.
      retry-interval: ${STORAGE_CLEANUP_RETRY_INTERVAL:1m}
      batch-size: 100
      max-attempts: ${STORAGE_CLEANUP_MAX_ATTEMPTS:20}
      max-delay: 6h
      lease: 5m
      # Orphan sweep: objects without a photo row. Dry run by default: it only logs until an operator turns it off.
      orphan-sweep-enabled: ${STORAGE_ORPHAN_SWEEP_ENABLED:true}
      orphan-dry-run: ${STORAGE_ORPHAN_DRY_RUN:true}
      orphan-min-age: ${STORAGE_ORPHAN_MIN_AGE:24h}
      orphan-interval: ${STORAGE_ORPHAN_INTERVAL:6h}
      orphan-scan-limit: 1000
      orphan-max-deletes-per-run: ${STORAGE_ORPHAN_MAX_DELETES:100}
      orphan-max-ratio: 0.5
  driver:
    # Vietnamese PET driving licence numbers have 12 digits.
    license-number-pattern: ${DRIVER_LICENSE_NUMBER_PATTERN:^[0-9]{12}$}
    # Classes allowed to drive trucks (Luật TTATGT 2024 + legacy B2/FC still in circulation).
    allowed-license-classes: ${DRIVER_ALLOWED_LICENSE_CLASSES:B,B2,C1,C,CE,D,FC}
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} [requestId=%X{requestId:-}] - %msg%n%ex"
  level:
    root: INFO
    com.truckgo: INFO
