server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
spring:
  application:
    name: truckgo-api
  profiles:
    active: ${APP_ENV:dev}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:truckgo_v2}?currentSchema=public&options=-c%20TimeZone%3DUTC
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  servlet:
    multipart:
      # Per-file limit is enforced again in ShipmentAttachmentService (default 5 MB).
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:5MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:6MB}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
springdoc:
  packages-to-scan: com.truckgo
  paths-to-match: /api/v1/**
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: false
app:
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    bcrypt-strength: ${BCRYPT_STRENGTH:10}
    jwt:
      # Base64-encoded HMAC key, >= 32 bytes (e.g. `openssl rand -base64 48`). Mandatory outside dev/test.
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:truckgo-api}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh:
      ttl: ${REFRESH_TOKEN_TTL:7d}
      reuse-grace: ${REFRESH_REUSE_GRACE:10s}
      cookie-name: ${REFRESH_COOKIE_NAME:tg_refresh}
      cookie-path: /api/v1/auth
      cookie-secure: ${REFRESH_COOKIE_SECURE:true}
      cookie-same-site: ${REFRESH_COOKIE_SAMESITE:Strict}
    login-rate-limit:
      enabled: ${LOGIN_RATE_LIMIT_ENABLED:true}
      max-failures-per-identifier: ${LOGIN_MAX_FAILURES:5}
      max-attempts-per-ip: ${LOGIN_MAX_ATTEMPTS_PER_IP:30}
      window: ${LOGIN_RATE_LIMIT_WINDOW:15m}
  maps:
    # Geocoding seam from Sprint 3 (only "none" exists).
    provider: none
    # Road distance for pricing: none (admin enters a verified distance) or google.
    route-provider: ${MAPS_ROUTE_PROVIDER:none}
    max-reasonable-km: ${MAPS_MAX_REASONABLE_KM:3000}
    google:
      # Never commit a key; set GOOGLE_MAPS_API_KEY in the environment.
      api-key: ${GOOGLE_MAPS_API_KEY:}
      base-url: ${GOOGLE_DIRECTIONS_URL:https://maps.googleapis.com/maps/api/directions/json}
      connect-timeout: ${MAPS_CONNECT_TIMEOUT:3s}
      read-timeout: ${MAPS_READ_TIMEOUT:5s}
  catalog:
    cache-ttl: ${CATALOG_CACHE_TTL:1h}
  pricing:
    cache-ttl: ${PRICING_CACHE_TTL:10m}
    quote-validity: ${QUOTE_VALIDITY:24h}
  shipment:
    business-zone: ${SHIPMENT_BUSINESS_ZONE:Asia/Ho_Chi_Minh}
    min-pickup-lead: ${SHIPMENT_MIN_PICKUP_LEAD:15m}
    max-stops: 10
    max-items: 50
    max-attachments: 10
    max-attachment-size: ${SHIPMENT_MAX_ATTACHMENT_SIZE:5MB}
    allowed-image-types: image/jpeg,image/png,image/webp
  marketplace:
    # Drivers can apply until this long before pickup; open orders expire at the pickup time.
    application-cutoff: ${MARKETPLACE_APPLICATION_CUTOFF:1h}
    max-pending-per-driver: ${MARKETPLACE_MAX_PENDING_PER_DRIVER:10}
    cache-ttl: ${MARKETPLACE_CACHE_TTL:30s}
    expiry-interval: ${MARKETPLACE_EXPIRY_INTERVAL:5m}
    expiry-job-enabled: ${MARKETPLACE_EXPIRY_JOB_ENABLED:true}
  trip:
    # Delivery confirmation code: validity, wrong guesses before lock, wait and limit for new codes.
    otp-ttl: ${TRIP_OTP_TTL:30m}
    otp-max-attempts: ${TRIP_OTP_MAX_ATTEMPTS:5}
    otp-resend-cooldown: ${TRIP_OTP_RESEND_COOLDOWN:60s}
    otp-max-sends: ${TRIP_OTP_MAX_SENDS:5}
    # HMAC key for stored codes; blank = derived from JWT_SECRET.
    otp-secret: ${TRIP_OTP_SECRET:}
    # in-app (notification inbox). An SMS adapter implementing OtpSender can be added for production.
    otp-channel: ${TRIP_OTP_CHANNEL:in-app}
    require-delivery-photo: ${TRIP_REQUIRE_DELIVERY_PHOTO:false}
    max-trip-photos: ${TRIP_MAX_PHOTOS:20}
  tracking:
    min-interval: ${TRACKING_MIN_INTERVAL:3s}
    live-threshold: ${TRACKING_LIVE_THRESHOLD:60s}
    stale-threshold: ${TRACKING_STALE_THRESHOLD:5m}
    max-future-skew: ${TRACKING_MAX_FUTURE_SKEW:2m}
    max-age: ${TRACKING_MAX_AGE:10m}
    max-speed-kmh: ${TRACKING_MAX_SPEED_KMH:200}
    moving-interval: ${TRACKING_MOVING_INTERVAL:8s}
    idle-interval: ${TRACKING_IDLE_INTERVAL:30s}
    min-distance-meters: ${TRACKING_MIN_DISTANCE_METERS:25}
    latest-ttl: ${TRACKING_LATEST_TTL:30m}
    retention: ${TRACKING_RETENTION:90d}
    stream-timeout: ${TRACKING_STREAM_TIMEOUT:10m}
    heartbeat: ${TRACKING_HEARTBEAT:20s}
  storage:
    provider: ${STORAGE_PROVIDER:none}
    endpoint: ${MINIO_ENDPOINT:}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:truckgo-private}
    region: ${MINIO_REGION:}
  driver:
    # Vietnamese PET driving licence numbers have 12 digits.
    license-number-pattern: ${DRIVER_LICENSE_NUMBER_PATTERN:^[0-9]{12}$}
    # Classes allowed to drive trucks (Luật TTATGT 2024 + legacy B2/FC still in circulation).
    allowed-license-classes: ${DRIVER_ALLOWED_LICENSE_CLASSES:B,B2,C1,C,CE,D,FC}
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} [requestId=%X{requestId:-}] - %msg%n%ex"
  level:
    root: INFO
    com.truckgo: INFO
