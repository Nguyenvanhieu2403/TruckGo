server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Shipment photos are up to 5 MB; nginx's default limit is 1 MB.
  # Host must keep the port so the API sees browser requests as same-origin (otherwise CORS rejects them).
  location /api/ { client_max_body_size 6m; proxy_pass http://backend:8080/api/; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Request-ID $request_id; }
  location /actuator/ { proxy_pass http://backend:8080/actuator/; proxy_set_header Host $host; }
  location /swagger-ui/ { proxy_pass http://backend:8080/swagger-ui/; proxy_set_header Host $host; }
  location = /swagger-ui.html { proxy_pass http://backend:8080/swagger-ui.html; proxy_set_header Host $host; }
  location /v3/api-docs { proxy_pass http://backend:8080/v3/api-docs; proxy_set_header Host $host; }
  location / { try_files $uri $uri/ /index.html; }
}
