name: CI

on:
  push:
    branches: ["sprint-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Integration tests start PostgreSQL, Redis and MinIO with Testcontainers (Docker is available on the runner).
      - run: mvn -B -ntp test
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports
          retention-days: 7

  frontend:
    name: Frontend (unit + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright on the Compose stack)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      E2E_BASE_URL: http://localhost:4200
      E2E_ADMIN_EMAIL: admin@truckgo.local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate throwaway credentials
        # Fresh per run and masked in logs; the stack is destroyed at the end of the job.
        run: |
          admin_password="E2e-$(openssl rand -hex 12)"
          echo "::add-mask::$admin_password"
          echo "E2E_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          cp .env.example .env
          sed -i \
            -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" \
            -e "s|^MINIO_ROOT_PASSWORD=.*|MINIO_ROOT_PASSWORD=$(openssl rand -hex 16)|" \
            -e "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')|" \
            .env
          grep -c '^JWT_SECRET=.\+' .env

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Create the admin used by the admin check
        run: >
          docker compose run --rm
          -e ADMIN_BOOTSTRAP_EMAIL="$E2E_ADMIN_EMAIL"
          -e ADMIN_BOOTSTRAP_PASSWORD="$E2E_ADMIN_PASSWORD"
          backend --bootstrap-admin

      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Stop the stack
        if: always()
        run: docker compose down -v
